name = "samvar-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — set up in Cloudflare after the domain is registered.
# routes = [{ pattern = "api.samvar.app", custom_domain = true }]

[vars]
MODEL = "claude-sonnet-5"
DAILY_CAP = "200"
RC_ENTITLEMENT = "pro"
ALLOW_UNENTITLED = "0"   # "1" only for local dev without RevenueCat

# Secrets (never in this file):
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put REVENUECAT_SECRET      # RevenueCat secret API key (sk_...)
#
# KV namespace for entitlement cache + daily caps:
#   wrangler kv namespace create QUOTA   → paste the id below
[[kv_namespaces]]
binding = "QUOTA"
id = "abc03a4b9c0a4fb3b6606fbdc5876ffc"
